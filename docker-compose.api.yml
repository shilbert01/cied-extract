# cied-extract HTTP service (server.py — docs/extract-api-v1.md)
#
# GPU (default — Qwen3-VL-8B, fits 3080 Ti 12 GB):
#   docker compose -f docker-compose.api.yml up -d --build
# GPU (Qwen3.8-27B via Ollama — needs ≥RTX 4090 24 GB):
#   CIED_EXTRACT_MODEL=qwen3.8-27b docker compose -f docker-compose.api.yml up -d --build
# CPU-only (slower, no nvidia-container-toolkit needed):
#   docker compose -f docker-compose.api.yml -f docker-compose.cpu.yml up -d --build
#
# Verify (host port 8082):
#   curl http://localhost:8082/health
#   curl -s --data-binary @report.pdf -H 'Content-Type: application/pdf' \
#        http://localhost:8082/v1/extract | jq .
#
# The central Pi points CIED_EXTRACT_URL at http://<this-host>:8082 (LAN).

services:
  # Same service name as docker-compose.yml/.cpu.yml so the CPU override composes.
  cied-extract:
    build: .
    image: cied-extract:latest

    # Override the CLI entrypoint with the HTTP server
    entrypoint: ["uvicorn", "server:app", "--host", "0.0.0.0", "--port", "8000"]

    # Host 8082 → container 8000
    ports:
      - "8082:8000"

    volumes:
      # HuggingFace model weights persist across restarts (first run downloads ~1.8 GB)
      - model_cache:/cache

    environment:
      HF_HOME: /cache/huggingface
      # qwen-vl-8b (default): transformers 4-bit, ~6 GB VRAM, fits 3080 Ti
      # qwen3.8-27b: Ollama GGUF Q4_K_XL, ~18 GB VRAM, needs ≥RTX 4090
      CIED_EXTRACT_MODEL: ${CIED_EXTRACT_MODEL:-qwen-vl-8b}
      CIED_EXTRACT_OLLAMA_URL: ${CIED_EXTRACT_OLLAMA_URL:-http://host.docker.internal:11434}
      NVIDIA_VISIBLE_DEVICES: "1"
      CUDA_VISIBLE_DEVICES: "0"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Pin to GPU 1 (RTX 3080 Ti) — GPU 0 (RTX 4090) is reserved for Ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]

    # Model takes a while to load — don't report healthy until /health says ready
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

    restart: unless-stopped

  annotator:
    build: .
    image: cied-extract:latest

    entrypoint: ["uvicorn", "annotator.app:app", "--host", "0.0.0.0", "--port", "8000"]

    ports:
      - "8090:8000"

    volumes:
      - annotator_work:/app/annotator/work
      - annotator_submissions:/app/annotator/submissions

    environment:
      # Reach the cied-extract service via docker network
      CIED_EXTRACT_URL: http://cied-extract:8000

    depends_on:
      - cied-extract

    restart: unless-stopped

volumes:
  model_cache:
    name: cied-extract_model_cache
  annotator_work:
    name: cied-extract_annotator_work
  annotator_submissions:
    name: cied-extract_annotator_submissions
